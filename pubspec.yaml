name: vorlo
description: "Vorlo: Production-Quality Android Download Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  ffi: ^2.1.3
  path_provider: ^2.1.5
  percent_indicator: ^4.2.5
  shared_preferences: ^2.5.4
  permission_handler: ^12.0.1
  open_filex: ^4.7.0
  flutter_local_notifications: ^18.0.1
  uuid: ^4.5.1
  file_picker: ^13.3.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/icons/
    - assets/fonts/sans/
    - assets/fonts/vazirmatn/

  fonts:
    - family: Sans
      fonts:
        - asset: assets/fonts/sans/NotoSans-Regular.ttf
        - asset: assets/fonts/sans/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/sans/NotoSans-Bold.ttf
          weight: 700

    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-Regular.ttf
        - asset: assets/fonts/vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn/Vazirmatn-Bold.ttf
          weight: 700
